schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - Ao concluir todas as tarefas de um apply e aprovar as verificações exigidas, crie exatamente um commit Git para a mudança; não crie commit de conclusão para apply pausado, com falha ou sem diff novo.
      - Antes de editar, registre o estado do Git. Preserve alterações preexistentes; adicione ao commit somente arquivos ou hunks da mudança aplicada, incluindo o tasks.md final. Revise o diff staged e execute git diff --cached --check antes do commit. Não use git add . para capturar o working tree inteiro.
      - 'Use a mensagem "Apply OpenSpec change: <nome-da-mudança>". Após o commit, verifique e informe o hash e os arquivos incluídos. Não crie tag, versão SemVer ou push, nem arquive a mudança OpenSpec automaticamente.'
