name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-local-password
          MYSQL_DATABASE: study_platform_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-local-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CI: true
      NODE_ENV: test
      API_PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 3307
      DB_USER: root
      DB_PASSWORD: ci-local-password
      DB_NAME: study_platform_dev
      TEST_DB_NAME: study_platform_test
      WEB_ORIGIN: http://localhost:5173
      API_PUBLIC_ORIGIN: http://localhost:3001
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@example.test
      EMAIL_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      EMAIL_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      VITE_API_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
