name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      CI: true
      NODE_ENV: test
      API_PORT: 3001
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: edutrack_ci
      DB_NAME: study_platform_dev
      TEST_DB_NAME: study_platform_test
      WEB_ORIGIN: http://localhost:5173
      API_PUBLIC_ORIGIN: http://localhost:3001
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_FROM: no-reply@example.test
      EMAIL_HMAC_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      EMAIL_ENCRYPTION_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      VITE_API_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native MySQL 8.4
        shell: bash
        run: |
          set -euo pipefail
          if systemctl list-unit-files mysql.service --no-legend | grep -q '^mysql.service'; then sudo systemctl stop mysql; fi
          sudo apt-get update
          sudo apt-get install -y libaio1t64 libmecab2 libnuma1 libtirpc3t64
          curl --fail --silent --show-error --location https://repo.mysql.com/RPM-GPG-KEY-mysql-2025 -o "$RUNNER_TEMP/mysql-key.asc"
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/mysql-key.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = BCA43417C3B485DD128EC6D4B7B3B788A8D3785C
          gpg --dearmor --output "$RUNNER_TEMP/mysql-key.gpg" "$RUNNER_TEMP/mysql-key.asc"
          sudo install -m 644 "$RUNNER_TEMP/mysql-key.gpg" /usr/share/keyrings/edutrack-mysql.gpg
          echo 'deb [signed-by=/usr/share/keyrings/edutrack-mysql.gpg] https://repo.mysql.com/apt/ubuntu/ noble mysql-8.4-lts' | sudo tee /etc/apt/sources.list.d/edutrack-mysql.list >/dev/null
          sudo apt-get update
          mysql_root="$RUNNER_TEMP/edutrack-mysql"
          mkdir -p "$mysql_root/packages" "$mysql_root/data"
          cd "$mysql_root/packages"
          apt-get download mysql-community-server-core mysql-community-client-core mysql-community-client-plugins
          for package in ./*.deb; do dpkg-deb --extract "$package" "$mysql_root"; done
          server="$mysql_root/usr/sbin/mysqld"
          client="$mysql_root/usr/bin/mysql"
          "$server" --no-defaults --version | grep -E 'Ver 8\.4\.'
          "$server" --no-defaults --initialize-insecure --basedir="$mysql_root/usr" --datadir="$mysql_root/data" --log-error="$mysql_root/mysql.log"
          "$server" --no-defaults --basedir="$mysql_root/usr" --datadir="$mysql_root/data" --plugin-dir="$mysql_root/usr/lib/mysql/plugin" --socket="$mysql_root/mysql.sock" --pid-file="$mysql_root/mysql.pid" --bind-address=127.0.0.1 --port=3306 --mysqlx=0 --skip-log-bin --log-error="$mysql_root/mysql.log" &
          ready=false
          for attempt in {1..60}; do
            if "$client" --no-defaults --socket="$mysql_root/mysql.sock" -uroot -e 'SELECT 1' >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then echo 'MySQL did not become ready within 60 seconds.' >&2; exit 1; fi
          db_password=$(openssl rand -hex 32)
          echo "::add-mask::$db_password"
          echo "DB_PASSWORD=$db_password" >> "$GITHUB_ENV"
          umask 077
          client_config="$mysql_root/client.cnf"
          printf '[client]\nhost=127.0.0.1\nport=3306\nuser=edutrack_ci\npassword=%s\n' "$db_password" > "$client_config"
          "$client" --no-defaults --socket="$mysql_root/mysql.sock" -uroot <<SQL
          CREATE DATABASE study_platform_test;
          CREATE USER 'edutrack_ci'@'127.0.0.1' IDENTIFIED BY '$db_password';
          GRANT ALL PRIVILEGES ON \`study_platform_test%\`.* TO 'edutrack_ci'@'127.0.0.1';
          ALTER USER 'root'@'localhost' ACCOUNT LOCK;
          SQL
          version=$("$client" --defaults-file="$client_config" --batch --skip-column-names -e 'SELECT VERSION()')
          [[ "$version" == 8.4.* ]]
          "$client" --defaults-file="$client_config" <<'SQL'
          CREATE DATABASE study_platform_test_ci_probe;
          CREATE TABLE study_platform_test_ci_probe.probe (id INT PRIMARY KEY);
          CREATE TRIGGER study_platform_test_ci_probe.probe_insert BEFORE INSERT ON study_platform_test_ci_probe.probe FOR EACH ROW SET NEW.id = NEW.id;
          DROP DATABASE study_platform_test_ci_probe;
          SQL
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Stop native MySQL
        if: always()
        shell: bash
        run: |
          pid_file="$RUNNER_TEMP/edutrack-mysql/mysql.pid"
          if [ -f "$pid_file" ]; then kill "$(cat "$pid_file")"; fi
